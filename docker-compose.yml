version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitbalance_app_1
      APP_PORT: 3710

  app:
    image: ghcr.io/egzola/bitbalance:1.0.25@sha256:04af8aa1152ccefb88c715760d0cc3642cd6bab50153d6df96fb002516f03c59
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3710
      ELECTRUM_HOST: $APP_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_ELECTRS_NODE_PORT
    volumes:
      - ${APP_DATA_DIR}/data:/data
